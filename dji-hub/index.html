<style>

    --sans: "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    --bg: #03060a;
    --line: rgba(150, 200, 220, .13);
    --card: linear-gradient(165deg, rgba(17, 25, 32, .92), rgba(7, 11, 15, .95));
    --text: #e2edf3;
    --sub: #8ba3ad;
    --green: #6ce0a8;
    --cyan: #5fd0f0;
    --amber: #ffb020;

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {

    font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1200px 760px at 14% -8%, rgba(108, 224, 168, .1), transparent 62%),
      radial-gradient(1000px 700px at 90% 6%, rgba(95, 208, 240, .09), transparent 60%),
      radial-gradient(900px 700px at 50% 112%, rgba(255, 106, 90, .07), transparent 62%),
      linear-gradient(180deg, #061016 0%, #04070a 42%, #02050a 100%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(140, 200, 220, .028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 200, 220, .028) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(1500px 950px at 50% 26%, #000 24%, transparent 82%);
  }
  .wrap { position: relative; z-index: 2; max-width: 1460px; margin: 0 auto; padding: 0 30px 100px; }

  nav {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 18px; padding: 15px 0;
    background: linear-gradient(180deg, rgba(3, 6, 10, .96), rgba(3, 6, 10, .5) 68%, transparent);
    backdrop-filter: blur(7px);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .rotor { width: 34px; height: 34px; position: relative; flex: none; }
  .logo .rotor i {
    position: absolute; inset: 0; border: 1.6px solid var(--green); border-radius: 50%;
    border-right-color: transparent; border-bottom-color: transparent; animation: spin 3.2s linear infinite;
  }
  .logo .rotor i:nth-child(2) { inset: 7px; border-color: var(--cyan); border-left-color: transparent; border-top-color: transparent; animation-duration: 2.1s; animation-direction: reverse; }
  .logo .rotor b { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px var(--green); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo h1 { margin: 0; font-size: 16.5px; letter-spacing: .04em; }
  .logo p { margin: 2px 0 0; font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--sub); }
  nav .navlinks { margin-left: 26px; display: flex; gap: 18px; font-size: 12.5px; }
  nav .navlinks a { color: var(--sub); text-decoration: none; transition: color .18s; }
  nav .navlinks a:hover { color: #fff; }
  nav .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  nav .meta { font-family: var(--mono); font-size: 10.5px; color: var(--sub); letter-spacing: .1em; }
  nav .meta b { color: var(--green); }
  .langbtn {
    font: inherit; font-family: var(--mono); font-size: 11px; cursor: pointer;
    padding: 5px 11px; border-radius: 16px; color: var(--text);

  }
  .langbtn:hover { border-color: rgba(108, 224, 168, .6); color: #fff; }
  #musicbtn { font-size: 13px; min-width: 38px; }
  #musicbtn.on { border-color: rgba(108, 224, 168, .85); color: #05231a;
    background: linear-gradient(135deg, #a8f0d8, #6ce0a8); }

  .hero { position: relative; padding: 54px 0 26px; min-height: 580px; }
  #heroCanvas {
    position: absolute; left: -40px; top: -60px; width: calc(100% + 80px); height: calc(100% + 110px);
    z-index: 0; opacity: .95; pointer-events: none;
  }
  .hero .inner { position: relative; z-index: 1; }
  .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--green);
    display: flex; align-items: center; gap: 12px;

  .kicker::before { content: ""; width: 40px; height: 1px; background: var(--green); opacity: .65; }

  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .cta a {

    transition: all .2s;

  .cta a.primary { border-color: rgba(108, 224, 168, .9); color: #05231a; font-weight: 600; background: linear-gradient(135deg, #a8f0d8, #6ce0a8); }
  .cta a:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(108, 224, 168, .2); }
  .stats { display: flex; flex-wrap: wrap; gap: 34px; margin-top: 44px; }
  .stat { border-left: 1px solid var(--line); padding-left: 16px; }
  .stat b { display: block; font-size: 27px; font-family: var(--mono); letter-spacing: -.02em; }
  .stat span { font-size: 10.5px; color: var(--sub); letter-spacing: .14em; font-family: var(--mono); }

  section { padding-top: 74px; }

  .sec-head .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .3em; color: var(--green); }
  .sec-head h3 { margin: 6px 0 0; font-size: 25px; letter-spacing: -.01em; }
  .sec-head p { margin: 0 0 3px; color: var(--sub); font-size: 13px; max-width: 620px; line-height: 1.75; }

  .chain { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(228px, 1fr)); }
  .link {
    position: relative; padding: 18px 18px 22px; border-radius: 15px; overflow: hidden;
    border: 1px solid var(--line); background: var(--card); text-decoration: none; color: inherit;
    transition: transform .26s cubic-bezier(.2,.7,.3,1), border-color .26s, box-shadow .26s;
  }
  .link:hover { transform: translateY(-4px); border-color: rgba(108, 224, 168, .42); box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .link .step { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; color: var(--sub); }
  .link h4 { margin: 10px 0 6px; font-size: 17px; }
  .link small { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--sub); }
  .link p { margin: 10px 0 0; font-size: 12px; line-height: 1.7; color: #a9bcc6; }
  .link .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .link.attack .bar { background: linear-gradient(180deg, #ff6a5a, transparent); }
  .link.medical .bar { background: linear-gradient(180deg, #6ce0a8, transparent); }
  .link.logistics .bar { background: linear-gradient(180deg, #ffb020, transparent); }
  .link.recon .bar { background: linear-gradient(180deg, #5fd0f0, transparent); }
  .link .go { position: absolute; right: 16px; bottom: 15px; font-family: var(--mono); font-size: 11px; color: var(--green); opacity: .8; }

  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  .card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line); border-radius: 18px; background: var(--card);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    transition: transform .28s cubic-bezier(.2,.7,.3,1), border-color .28s, box-shadow .28s;
  }
  .card:hover { transform: translateY(-5px); border-color: rgba(108, 224, 168, .45); box-shadow: 0 28px 72px rgba(0,0,0,.62); }
  .card.minor .thumb { height: 186px; }
  .card .thumb {
    position: relative; height: 214px; overflow: hidden;
    background: radial-gradient(420px 250px at 50% 108%, rgba(108, 224, 168, .1), transparent 70%), linear-gradient(180deg, #071016, #040a0e);
    border-bottom: 1px solid var(--line);
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 14px; transition: transform .55s cubic-bezier(.2,.7,.3,1); }
  .card:hover .thumb img { transform: scale(1.06); }
  .card .thumb .scan { position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background: linear-gradient(180deg, transparent, rgba(108,224,168,.13) 50%, transparent);
    transform: translateY(-100%); transition: transform .95s ease; }
  .card:hover .thumb .scan { transform: translateY(100%); }
  .card .thumb .code { position: absolute; left: 14px; top: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--green); text-shadow: 0 0 12px rgba(108,224,168,.5); }
  .card .thumb .cat { position: absolute; right: 12px; top: 11px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; padding: 3px 10px; border-radius: 20px; border: 1px solid currentColor; opacity: .92; }
  .cat.attack { color: var(--red); } .cat.medical { color: var(--green); }
  .cat.logistics { color: var(--amber); } .cat.recon { color: var(--cyan); }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
  .card h3 { margin: 0; font-size: 17.5px; }
  .card .en { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--sub); margin-top: 3px; }
  .card .desc { margin: 12px 0 0; font-size: 12.5px; line-height: 1.72; color: #b0c2cc; }
  .card ul.specs { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 5px; }
  .card ul.specs li { display: flex; gap: 10px; font-size: 11.5px; font-family: var(--mono); }
  .card ul.specs .k { color: var(--sub); width: 82px; flex: none; }
  .card ul.specs .v { color: #dbeaf1; }
  .card .modes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .mode { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; padding: 3px 9px; border-radius: 20px;
    border: 1px solid rgba(108, 224, 168, .3); color: #9fe8c8; background: rgba(108, 224, 168, .07); }
  .card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 18px; }
  .card .acts a {
    text-align: center; text-decoration: none; font-size: 12px; padding: 9px 8px; border-radius: 9px;
    border: 1px solid var(--line); color: var(--text); background: rgba(14, 22, 28, .82); transition: all .18s;
  }
  .card .acts a:hover { border-color: rgba(108, 224, 168, .6); color: #fff; box-shadow: 0 0 16px rgba(108, 224, 168, .16); }
  .card .acts a.primary { grid-column: span 2; border-color: rgba(108, 224, 168, .85); color: #05231a; font-weight: 600;
    background: linear-gradient(135deg, #a8f0d8, #6ce0a8); }
  .card .acts a.amber { border-color: rgba(255, 176, 32, .5); color: #ffe0a8; }
  .card .acts a.amber:hover { border-color: rgba(255, 176, 32, .95); box-shadow: 0 0 16px rgba(255, 176, 32, .22); }

  .feats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .feat { padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: rgba(10, 16, 21, .72); }
  .feat .ic { font-family: var(--mono); font-size: 11px; color: var(--green); letter-spacing: .16em; }
  .feat h4 { margin: 10px 0 7px; font-size: 15px; }
  .feat p { margin: 0; font-size: 12px; line-height: 1.75; color: #a9bcc6; }

  footer { margin-top: 76px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--sub); font-size: 11.5px; line-height: 2; }
  footer code { font-family: var(--mono); color: #9fe8c8; }
  #boot2 {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: #03060a; transition: opacity .6s; font-family: var(--mono); font-size: 12px; color: var(--green);
    letter-spacing: .28em;
  }
  #boot2.hide { opacity: 0; pointer-events: none; }
  #boot2 .boot-inner { text-align: center; }
  #boot2 .boot-brand { font-size: 13px; letter-spacing: .42em; color: var(--green); }

  #boot2 .boot-log div { display: flex; gap: 9px; align-items: center; opacity: 0;

  #boot2 .boot-log div.in { opacity: 1; transform: none; }
  #boot2 .boot-log i { color: var(--cyan); font-style: normal; text-shadow: 0 0 10px rgba(95,208,240,.7); }
</style>

      fetch('dsh-startup.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(apply).catch(function () { apply(null); });
      setTimeout(function () { apply(null); }, 1200);
      return;
    }
  } catch (e) {}
  try {
    var sc = document.createElement('script');
    sc.src = 'dsh-startup.js';
    sc.onload = function () { apply(window.DSH_STARTUP); };
    sc.onerror = function () { apply(null); };
    document.head.appendChild(sc);
    setTimeout(function () { apply(null); }, 1200);
  } catch (e2) { apply(null); }
})();

(function hero() {
  var cv = document.getElementById('heroCanvas');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var P = [], E = [];
  function v(x, y, z) { P.push([x, y, z]); return P.length - 1; }
  var bodyU = [v(-0.30, 0.10, 0.42), v(0.30, 0.10, 0.42), v(0.30, 0.10, -0.42), v(-0.30, 0.10, -0.42)];
  var bodyL = [v(-0.24, -0.06, 0.36), v(0.24, -0.06, 0.36), v(0.24, -0.06, -0.36), v(-0.24, -0.06, -0.36)];
  var i;
  for (i = 0; i < 4; i++) { E.push([bodyU[i], bodyU[(i + 1) % 4]]); E.push([bodyL[i], bodyL[(i + 1) % 4]]); E.push([bodyU[i], bodyL[i]]); }
  [[0.55, 0.55], [-0.55, 0.55], [0.55, -0.55], [-0.55, -0.55]].forEach(function (a) {
    var r = v(Math.sign(a[0]) * 0.22, 0.06, Math.sign(a[1]) * 0.24);
    var hubU = v(a[0], 0.20, a[1]);
    var hubL = v(a[0], 0.05, a[1]);
    E.push([r, hubU]); E.push([r, hubL]);
    var disc = [], disc2 = [], k;
    for (k = 0; k < 16; k++) {
      var ang = k / 16 * Math.PI * 2;
      disc.push(v(a[0] + Math.cos(ang) * 0.30, 0.24, a[1] + Math.sin(ang) * 0.30));
      disc2.push(v(a[0] + Math.cos(ang) * 0.26, 0.00, a[1] + Math.sin(ang) * 0.26));
    }
    for (k = 0; k < 16; k++) { E.push([disc[k], disc[(k + 1) % 16]]); E.push([disc2[k], disc2[(k + 1) % 16]]); }
    E.push([hubU, disc[0]]);
  });
  [[0.24, 0.30], [-0.24, 0.30], [0.24, -0.30], [-0.24, -0.30]].forEach(function (g) {
    E.push([v(g[0], -0.06, g[1]), v(g[0], -0.34, g[1])]);
  });

  var stars = [];
  function resize() {
    var rect = cv.getBoundingClientRect();
    W = Math.max(300, rect.width); H = Math.max(220, rect.height);
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  for (var p = 0; p < 90; p++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random(), s: Math.random() * 1.4 + 0.4 });

  var t0 = Date.now();
  function project(x, y, z, ry, rx, scale, cx, cy) {
    var c = Math.cos(ry), s = Math.sin(ry);
    var X = x * c - z * s, Z = x * s + z * c;
    var c2 = Math.cos(rx), s2 = Math.sin(rx);
    var Y = y * c2 - Z * s2, Z2 = y * s2 + Z * c2;
    var f = 1 / (1 + Z2 * 0.34);
    return [cx + X * scale * f, cy - Y * scale * f, f];
  }

  function draw() {
    var t = (Date.now() - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    var cx = W * 0.70, cy = H * 0.50, scale = Math.min(W, H) * 0.60;
    var horizon = cy + H * 0.30;

    ctx.save();
    ctx.strokeStyle = 'rgba(108,224,168,.10)';
    ctx.lineWidth = 1;
    for (var gx = -8; gx <= 8; gx++) {
      ctx.beginPath(); ctx.moveTo(cx + gx * 26, horizon - 8); ctx.lineTo(cx + gx * 210, H + 40); ctx.stroke();
    }
    for (var gz = 0; gz < 9; gz++) {
      var yy = horizon + Math.pow(gz / 8, 2.1) * (H - horizon) * 0.92;
      ctx.globalAlpha = 0.9 - gz * 0.08;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    var rr = Math.min(W, H) * 0.42, a = (t * 0.55) % (Math.PI * 2);
    var grd = ctx.createRadialGradient(cx, horizon - 20, 4, cx, horizon - 20, rr);
    grd.addColorStop(0, 'rgba(108,224,168,.15)');
    grd.addColorStop(1, 'rgba(108,224,168,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.moveTo(cx, horizon - 20); ctx.arc(cx, horizon - 20, rr, a - 0.5, a); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(108,224,168,.22)';
    for (var kk = 1; kk <= 3; kk++) {
      ctx.beginPath(); ctx.ellipse(cx, horizon - 20, rr * kk / 3, rr * kk / 6, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    for (var i2 = 0; i2 < stars.length; i2++) {
      var q = stars[i2];
      var px = cx + (q.x - 0.5) * W * 1.5 + Math.sin(t * 0.2 + i2) * 6;
      var py = cy + (q.y - 0.5) * H * 1.1 + Math.cos(t * 0.16 + i2) * 5;
      ctx.fillStyle = 'rgba(180,220,240,' + (0.10 + q.z * 0.22) + ')';
      ctx.fillRect(px, py, q.s, q.s);
    }
    ctx.restore();

    var ry = t * 0.42, rx = 0.34 + Math.sin(t * 0.3) * 0.06, bob = Math.sin(t * 0.8) * 6;
    ctx.save();
    ctx.lineCap = 'round';
    for (var e = 0; e < E.length; e++) {
      var A = P[E[e][0]], B = P[E[e][1]];
      var pa = project(A[0], A[1], A[2], ry, rx, scale, cx, cy + bob);
      var pb = project(B[0], B[1], B[2], ry, rx, scale, cx, cy + bob);
      var depth = (pa[2] + pb[2]) / 2;
      var alpha = Math.max(0.06, Math.min(0.72, (depth - 0.62) * 2.1));
      ctx.strokeStyle = 'rgba(150,240,205,' + alpha + ')';
      ctx.lineWidth = depth > 1 ? 1.5 : 0.9;
      ctx.shadowColor = 'rgba(108,224,168,.5)';
      ctx.shadowBlur = depth > 1 ? 9 : 4;
      ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    var sy = ((t * 90) % (H + 260)) - 130;
    var lg = ctx.createLinearGradient(0, sy - 90, 0, sy + 90);
    lg.addColorStop(0, 'rgba(108,224,168,0)');
    lg.addColorStop(0.5, 'rgba(108,224,168,.07)');
    lg.addColorStop(1, 'rgba(108,224,168,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, sy - 90, W, 180);
    ctx.restore();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

/* 启动层淡出时机由 dsh-startup 配置控制（见上方 hubStartup）*/
</script>
